[package]
name = "claude-session-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Keeps the Claude desktop app's Code-tab session list the same under every account signed in on a Windows PC."
keywords = ["claude", "sessions", "sync", "windows"]
categories = ["command-line-utilities"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ssgardaf/claude-session-sync"

[lib]
name = "claude_session_sync"
path = "src/lib.rs"

[[bin]]
name = "claude-session-sync"
path = "src/bin/console.rs"

[[bin]]
name = "claude-session-syncw"
path = "src/bin/windowless.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "unwind"
